      [2, 1, 0].forEach(function (k) {
        if (xpAt < xpLo[k] || xpAt > xpHi[k]) return;
        var f = qFit(k, xpAt), e0 = Math.max(0, xpAt - 2.5), e1 = Math.min(XR[1], xpAt + 2.5);
        el("line", { x1: sx(e0), x2: sx(e1), y1: sy(f + s * (e0 - xpAt)), y2: sy(f + s * (e1 - xpAt)), "class": "tangent" }, lines);
        el("circle", { cx: sx(xpAt), cy: sy(f), r: 6, "class": "tan-dot" }, lines);
        if (!labelled) {
          el("text", { x: sx(xpAt) + (xpAt > 18 ? -10 : 10), y: sy(f) - 16, "text-anchor": xpAt > 18 ? "end" : "start", "class": "gap-label" }, lines,
            "slope " + s.toFixed(3));
          labelled = true;
        }
      });
    } else {
      var b = mode === 3 ? MX : MI;
      var hs = function (e) { return b[0] + b[1] * e; };
      var colg = mode === 3 ? function (e) { return b[0] + b[1] * e + b[2]; } : function (e) { return b[0] + b[2] + (b[1] + b[3]) * e; };
      el("line", { x1: sx(0), x2: sx(17), y1: sy(hs(0)), y2: sy(hs(17)), "class": "line-hs" }, lines);
      el("line", { x1: sx(0), x2: sx(17), y1: sy(colg(0)), y2: sy(colg(17)), "class": "line-ba" }, lines);
      if (mode === 3) {
        el("line", { x1: sx(8), x2: sx(8), y1: sy(hs(8)), y2: sy(colg(8)), "class": "gap" }, lines);
        el("text", { x: sx(8) + 8, y: (sy(hs(8)) + sy(colg(8))) / 2 + 6, "class": "gap-label" }, lines, "gap " + b[2].toFixed(3) + " at every experience");
      } else {
        el("text", { x: sx(16.6), y: sy(colg(16.6)) - 12, "text-anchor": "end", "class": "mean-label", fill: "var(--ba)" }, lines, "college slope " + (b[1] + b[3]).toFixed(3));
        el("text", { x: sx(16.6), y: sy(hs(16.6)) + 44, "text-anchor": "end", "class": "mean-label", fill: "var(--hs)" }, lines, "high-school slope " + b[1].toFixed(3));
      }
    }

    $("legend").innerHTML = all3
      ? key("var(--base)", "less than 12 years (base), " + men(cnt3[0])) + key("var(--hs)", "12–15 years (HSG), " + men(cnt3[1])) +
        key("var(--ba)", "16 or more (BA), " + men(cnt3[2]))
      : key("var(--hs)", "high school (12 years), " + men(cnt[0])) + key("var(--ba)", "college (16 years), " + men(cnt[1]));
    $("jit").hidden = !cat;
    $("xp-wrap").hidden = mode !== 5;

    if (mode === 1) {
      $("eq").textContent = "lwage = " + M1[0].toFixed(3) + sg(M1[1]) + " × college";
      $("key-label").textContent = "Coefficient on college";
      $("key-num").textContent = f3(M1[1]);
      $("note").textContent = "The intercept, " + M1[0].toFixed(3) + ", is the average for high-school grads (college = 0). The coefficient is a difference in averages: " +
        (M1[0] + M1[1]).toFixed(3) + " − " + M1[0].toFixed(3) + " = " + M1[1].toFixed(3) + ". College grads earn about " + pct(M1[1]) + " more, on average.";
    } else if (mode === 2) {
      $("eq").textContent = "lwage = " + MG[0].toFixed(3) + sg(MG[1]) + " × HSG" + sg(MG[2]) + " × BA";
      $("key-label").textContent = "BA vs. HSG gap: δ₂ − δ₁";
      $("key-num").textContent = f3(MG[2] - MG[1]);
      $("note").textContent = "All " + n3.toLocaleString("en-US") + " men. The intercept, " + MG[0].toFixed(3) + ", is the average for the base group (less than 12 years). " +
        "Each dummy's coefficient is that group's gap from the base: HSG " + (MG[0] + MG[1]).toFixed(3) + " − " + MG[0].toFixed(3) + " = " + MG[1].toFixed(3) +
        ", BA " + (MG[0] + MG[2]).toFixed(3) + " − " + MG[0].toFixed(3) + " = " + MG[2].toFixed(3) + ". BA vs. HSG is the difference: " +
        MG[2].toFixed(3) + " − " + MG[1].toFixed(3) + " = " + (MG[2] - MG[1]).toFixed(3) + ", about " + pct(MG[2] - MG[1]) + ".";
    } else if (mode === 3) {
      $("eq").textContent = "lwage = " + MX[0].toFixed(3) + sg(MX[1]) + " × exper" + sg(MX[2]) + " × college";
      $("key-label").textContent = "Coefficient on college, holding experience constant";
      $("key-num").textContent = f3(MX[2]);
      $("note").textContent = "The dummy shifts the line up: same slope, different intercept. The gap grew from " + M1[1].toFixed(3) + " to " + MX[2].toFixed(3) + " (about " + pct(MX[2]) + ")" +
        " because college grads have less experience (" + meanEx[1].toFixed(1) + " vs " + meanEx[0].toFixed(1) +
        " years). Two thumbs: experience raises wages (+) and goes down with college (−), so leaving it out biased the gap down.";
    } else if (mode === 5) {
      $("eq").textContent = "lwage = " + MQ[0].toFixed(3) + sg(MQ[1]) + " × exper" + (MQ[2] < 0 ? " − " : " + ") + Math.abs(MQ[2]).toFixed(5) +
        " × exper²" + sg(MQ[3]) + " × HSG" + sg(MQ[4]) + " × BA";
      $("key-label").textContent = "Slope of experience at " + xpAt + (xpAt === 1 ? " year" : " years");
      $("key-num").textContent = f3(qSlope(xpAt));
      $("note").textContent = "All " + n3.toLocaleString("en-US") + " men. The slope is " + MQ[1].toFixed(3) + " − 2 × " + Math.abs(MQ[2]).toFixed(5) +
        " × exper, so it shrinks as experience grows. The first year of experience goes with about " + pct(qSlope(0)) +
        " higher wages; at 10 years, one more year goes with only about " + pct(qSlope(10)) + ". The curve is flat at about " + qPeak.toFixed(1) + " years. The dummies shift each curve up by the same amount at every " +
        "experience: HSG " + MQ[3].toFixed(3) + " and BA " + MQ[4].toFixed(3) + " above the base group. Both are bigger than in step 2 (" +
        MG[1].toFixed(3) + " and " + MG[2].toFixed(3) + ") because more school goes with less experience, the same story as step 3.";
    } else {
      $("eq").textContent = "lwage = " + MI[0].toFixed(3) + sg(MI[1]) + " × exper" + sg(MI[2]) + " × college" + sg(MI[3]) + " × exper × college";
      $("key-label").textContent = "Interaction: difference in slopes";
      $("key-num").textContent = f3(MI[3]);
      $("note").textContent = "Each year of experience goes with " + (100 * MI[1]).toFixed(1) + "% higher wages for high-school grads and " + (100 * (MI[1] + MI[3])).toFixed(1) +
        "% for college grads. The interaction, " + MI[3].toFixed(3) + ", is the difference. Same lines as running a separate regression for each group.";
    }
    ["m1", "m2", "m3", "m4", "m5"].forEach(function (id, k) { $(id).setAttribute("aria-pressed", String(k + 1 === mode)); });
  }
  // Each step opens with the points stacked on their dummy values.
  [1, 2, 3, 4, 5].forEach(function (k) { $("m" + k).addEventListener("click", function () { setJitter(false); draw(k); }); });
  $("jit").addEventListener("click", function () { setJitter(!spread); });
  $("xp").addEventListener("input", function () {
    xpAt = Number(this.value);
    $("xp-out").textContent = xpAt + (xpAt === 1 ? " year" : " years");
    draw(5);
  });
  draw(1);
})();
</script>
</body>
</html>
