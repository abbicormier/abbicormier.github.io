      el("text", { x: M.l - 10, y: sy(t) + 6, "text-anchor": "end", "class": "tick" }, a, String(t));
    });
    D.xTicks.forEach(function (t) {
      el("line", { x1: sx(t), x2: sx(t), y1: M.t, y2: H - M.b }, g);
      el("text", { x: sx(t), y: H - M.b + 24, "text-anchor": "middle", "class": "tick" }, a, String(t));
    });
    el("line", { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b }, a);
    el("line", { x1: M.l, x2: M.l, y1: M.t, y2: H - M.b }, a);
    el("text", { x: (M.l + W - M.r) / 2, y: H - 14, "text-anchor": "middle", "class": "axis-title" }, a, D.xLabel);
    el("text", { x: 20, y: (M.t + H - M.b) / 2, "text-anchor": "middle", "class": "axis-title",
      transform: "rotate(-90 20 " + (M.t + H - M.b) / 2 + ")" }, a, D.yLabel);
    var gp = clear("g-pts");
    if (state.key === "toy") {
      D.pts.forEach(function (p, i) {
        el("circle", { cx: sx(D.raw[i]), cy: sy(p[1]), r: 10, "class": "pt", "data-i": i }, gp);
        el("text", { x: sx(D.raw[i]) + 15, y: sy(p[1]) + 6, "class": "pt-label", "data-i": i }, gp, p[3]);
      });
    } else {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < D.ys.length; i++) {
        frag.appendChild(el("circle", { cx: sx(D.jit[i]), cy: sy(D.ys[i]), r: 2.6, "class": "cloud", "data-i": i }));
      }
      gp.appendChild(frag);
    }
  }

  function fitLine(g, fit, cls, label, labelY) {
    var D = d(), x0 = D.x[0] + 0.3, x1 = D.x[1] - 0.3;
    el("line", { x1: sx(x0), x2: sx(x1), y1: sy(fit.a + fit.b * x0), y2: sy(fit.a + fit.b * x1), "class": "fit " + cls }, g);
    var lx = D.x[1] - (D.x[1] - D.x[0]) * 0.02, ly = fit.a + fit.b * lx;
    el("text", { x: sx(lx), y: sy(ly) + labelY, "text-anchor": "end", "class": "fit-label", fill: cls.indexOf("after") >= 0 ? "var(--ink)" : "var(--before)" }, g, label);
  }

  function update() {
    var D = d(), toy = state.key === "toy";
    // move points: translate by (adjusted - raw) in screen units
    var pts = $("g-pts").children;
    for (var k = 0; k < pts.length; k++) {
      var node = pts[k], i = +node.getAttribute("data-i");
      var from = toy ? D.raw[i] : D.jit[i];
      var dx = state.hold ? sx(D.adj[i]) - sx(from) : 0;
      node.style.transform = "translate(" + dx.toFixed(2) + "px, 0px)";
      if (toy && node.tagName === "circle") {
        node.setAttribute("class", "pt" + (state.reveal ? (D.pts[i][2] ? " hard" : " easy") : ""));
      }
    }
    var g = clear("g-fit"), fb = D.fitRaw, fa = D.fitAdj, dg = D.digits;
    fitLine(g, fb, "before" + (state.hold ? " ghost" : ""), "slope " + signed(fb.b, dg), toy ? 28 : -12);
    if (state.hold) fitLine(g, fa, "after", "slope " + signed(fa.b, dg), toy ? -14 : 26);

    $("slope").textContent = signed(state.hold ? fa.b : fb.b, dg);
    $("slope").style.color = state.hold ? "var(--ink)" : "var(--before)";
    $("was").textContent = state.hold ? "was " + signed(fb.b, dg) + " before holding it constant" : "";
    $("slope-label").textContent = toy ? "Slope: points per hour studied" : "Slope: log wage per year of school";
    $("btn-reveal").hidden = !toy;
    $("btn-reveal").setAttribute("aria-pressed", String(state.reveal));
    $("btn-reveal").textContent = state.reveal ? "Hide the class" : "Reveal the class";
    $("btn-hold").setAttribute("aria-pressed", String(state.hold));
    $("btn-hold").textContent = toy ? (state.hold ? "Undo: back to raw hours" : "Hold class constant")
                                    : (state.hold ? "Undo: back to raw schooling" : "Hold experience, race and region constant");
    var note;
    if (toy) {
      note = !state.hold ? (state.reveal ? "Blue took the easy class, orange the hard one. Hard-class students study more and score lower."
                                         : "Across all six students, more studying goes with lower scores. Should they stop studying?")
                         : "Each student now sits at their hours relative to their own class average (plus 7, the overall average). Within a class, every extra hour is worth 2 points.";
    } else {
      note = !state.hold ? "All 3,010 men, years of school against log wage. Points are jittered sideways so the stacks are visible."
                         : "Each man now sits at his schooling relative to men with the same experience, race and region (plus 13.3, the average). Same coefficient as Card's Table 2: 0.075.";
    }
    $("note").textContent = note;
    var lg = $("legend");
    lg.innerHTML = "";
    function key(html) { var s = document.createElement("span"); s.className = "key"; s.innerHTML = html; lg.appendChild(s); }
    if (toy && state.reveal) {
      key('<span class="swatch" style="background:var(--easy)"></span>easy class');
      key('<span class="swatch" style="background:var(--hard)"></span>hard class');
    }
    key('<span class="swatch line" style="border-color:var(--before)"></span>plain regression');
    if (state.hold) key('<span class="swatch line" style="border-color:var(--ink)"></span>holding ' + (toy ? "class" : "the controls") + ' constant');
  }

  function load(key) {
    state.key = key; state.hold = false; state.reveal = false;
    $("ds-toy").setAttribute("aria-pressed", String(key === "toy"));
    $("ds-card").setAttribute("aria-pressed", String(key === "card"));
    drawFrame(); update();
  }
  $("ds-toy").addEventListener("click", function () { load("toy"); });
  $("ds-card").addEventListener("click", function () { load("card"); });
  $("btn-reveal").addEventListener("click", function () { state.reveal = !state.reveal; update(); });
  $("btn-hold").addEventListener("click", function () {
    state.hold = !state.hold;
    if (state.hold && state.key === "toy") state.reveal = true;
    update();
  });

  // ================= Two thumbs =================
  var CASES = [
    { q: "Does studying raise exam scores?", z: "which class you took (hard or easy)",
      zy: "hard class → score", zx: "hard class with hours", s1: -1, s2: 1,
      w1: "A hard class lowers scores at any number of hours.", w2: "Students in hard classes study more.",
      v: "The plain slope is too low. It made studying look harmful: −1 instead of +2." },
    { q: "Does school raise wages?", z: "ability",
      zy: "ability → wages", zx: "ability with schooling", s1: 1, s2: 1,
      w1: "More able people earn more at any level of schooling.", w2: "More able people tend to stay in school longer.",
      v: "The plain slope is too high. In week 5, adding IQ pulled it from 0.039 down to 0.026." },
    { q: "Does school raise wages?", z: "work experience",
      zy: "experience → wages", zx: "experience with schooling", s1: 1, s2: -1,
      w1: "More experience pays: +0.041 per year.", w2: "At the same age, a year in school is a year not working: −1.01.",
      v: "The plain slope is too low: 0.052 = 0.093 + 0.041 × (−1.01). That's the Day 1 cliffhanger." },
    { q: "Does ad spending raise sales?", z: "the holiday season",
      zy: "holidays → sales", zx: "holidays with ad spending", s1: 1, s2: 1,
      w1: "People buy more in December no matter what.", w2: "Firms spend more on ads in December.",
      v: "The plain slope is too high. Ads get credit for sales the holidays would have brought anyway." },
    { q: "Does a hospital stay improve health?", z: "how sick you were",
      zy: "sickness → health", zx: "sickness with hospital stays", s1: -1, s2: 1,
      w1: "Sicker people are less healthy later.", w2: "Sicker people are the ones who go to the hospital.",
      v: "The plain slope is too low. Hospitals can look like they make people sicker." },
    { q: "Do more police officers raise crime?", z: "the city's underlying crime problem",
      zy: "crime problem → crime", zx: "crime problem with police", s1: 1, s2: 1,
      w1: "Cities with bigger crime problems have more crime.", w2: "Those cities hire more police.",
      v: "The plain slope is too high. Police can look like they cause crime." }
  ];
  var t = { i: 0, step: 0 };
  function showSign(id, s) { var n = $(id); n.textContent = s > 0 ? "+" : "−"; n.className = "sign " + (s > 0 ? "pos" : "neg"); }
  function hideSign(id) { var n = $(id); n.textContent = "?"; n.className = "sign unk"; }
  function renderCase() {
    var c = CASES[t.i];
    $("t-q").textContent = c.q; $("t-z").textContent = c.z;
    $("t-zy").textContent = c.zy; $("t-zx").textContent = c.zx;
    if (t.step >= 1) { showSign("t-s1", c.s1); $("t-w1").textContent = c.w1; } else { hideSign("t-s1"); $("t-w1").textContent = ""; }
    if (t.step >= 2) { showSign("t-s2", c.s2); $("t-w2").textContent = c.w2; } else { hideSign("t-s2"); $("t-w2").textContent = ""; }
    var v = $("t-verdict"), up = c.s1 * c.s2 > 0;
    v.hidden = t.step < 3;
    v.className = "verdict " + (up ? "up" : "down");
    v.textContent = (up ? "Same signs: biased UP. " : "Different signs: biased DOWN. ") + c.v;
    $("t-reveal").textContent = ["Reveal thumb 1", "Reveal thumb 2", "Reveal the bias", "Start over"][t.step];
    $("t-count").textContent = (t.i + 1) + " of " + CASES.length;
    $("t-prev").disabled = t.i === 0; $("t-next").disabled = t.i === CASES.length - 1;
  }
  $("t-reveal").addEventListener("click", function () { t.step = (t.step + 1) % 4; renderCase(); });
  $("t-next").addEventListener("click", function () { if (t.i < CASES.length - 1) { t.i++; t.step = 0; renderCase(); } });
  $("t-prev").addEventListener("click", function () { if (t.i > 0) { t.i--; t.step = 0; renderCase(); } });

  function tab(which) {
    $("tab-slide").setAttribute("aria-pressed", String(which === "slide"));
    $("tab-thumbs").setAttribute("aria-pressed", String(which === "thumbs"));
    $("view-slide").hidden = which !== "slide";
    $("view-thumbs").hidden = which !== "thumbs";
  }
  $("tab-slide").addEventListener("click", function () { tab("slide"); });
  $("tab-thumbs").addEventListener("click", function () { tab("thumbs"); });

  load("toy");
  renderCase();
})();
</script>
</body>
</html>
