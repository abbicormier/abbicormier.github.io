{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- Site icons. Declared explicitly so the version query can bust the browser's
     favicon cache. Without these tags a browser falls back to /favicon.ico and
     holds onto it almost indefinitely. Bump ?v= whenever the icon changes. -->
<link rel="icon" href="{{ base_path }}/favicon.ico?v=isu-2026" sizes="any">
<link rel="icon" type="image/png" href="{{ base_path }}/images/isu-spirit-orange.png?v=isu-2026">
<link rel="apple-touch-icon" href="{{ base_path }}/images/isu-spirit-orange.png?v=isu-2026">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
